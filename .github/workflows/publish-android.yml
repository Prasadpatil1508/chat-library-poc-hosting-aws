# Publish Android artifact to GitHub Packages when a release is created.
# Tag format: v1.0.0 → library version 1.0.0
name: Publish Android to GitHub Packages
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ./gradlew :shared:publishAllPublicationsToGitHubPackagesRepository \
            -Pgpr.user=${{ github.repository_owner }} \
            -Pgpr.token=${{ secrets.GITHUB_TOKEN }} \
            -PLIB_VERSION="$VERSION" \
            --no-daemon
        # GitHub Packages URL used by this repo
        # Consumers use: https://maven.pkg.github.com/${{ github.repository }}
