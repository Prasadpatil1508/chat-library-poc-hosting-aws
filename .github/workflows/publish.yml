name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest

    env:
      GRADLE_OPTS: "-Xmx4g"
      ORG_GRADLE_PROJECT_kotlin.native.ignoreDisabledTargets: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure Gradle TLS
        run: |
          echo "org.gradle.jvmargs=-Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2" >> gradle.properties

      - name: Get CodeArtifact auth token and set repo vars
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain ${{ secrets.AWS_DOMAIN }} \
            --domain-owner ${{ secrets.AWS_ACCOUNT_ID }} \
            --region ${{ secrets.AWS_REGION }} \
            --query authorizationToken \
            --output text)

          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AWS_DOMAIN=${{ secrets.AWS_DOMAIN }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_REPO=${{ secrets.AWS_REPO }}" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # Swift registry package identifier = SCOPE.PACKAGE (e.g. company.chat-sdk). Set via repo variables or defaults.
          echo "SWIFT_PACKAGE_SCOPE=${{ vars.SWIFT_PACKAGE_SCOPE || 'company' }}" >> $GITHUB_ENV
          echo "SWIFT_PACKAGE_NAME=${{ vars.SWIFT_PACKAGE_NAME || 'chat-sdk' }}" >> $GITHUB_ENV

      - name: Inject Connect config for remote library build
        run: |
          echo "API_GATEWAY=${{ secrets.API_GATEWAY }}" >> local.properties
          echo "CONTACT_FLOW_ID=${{ secrets.CONTACT_FLOW_ID }}" >> local.properties
          echo "INSTANCE_ID=${{ secrets.INSTANCE_ID }}" >> local.properties
          echo "REGION=${{ secrets.REGION }}" >> local.properties

      - name: Publish Android library to AWS CodeArtifact
        run: |
          chmod +x gradlew
          ./gradlew clean \
            :shared:generateConnectConfig \
            :shared:publishAndroidPublicationToAWSCodeArtifactRepository \
            -PLIB_VERSION="${{ env.VERSION }}" \
            --no-daemon \
            --no-configuration-cache

      - name: Assemble XCFramework
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            --no-daemon \
            --no-configuration-cache

      - name: Copy XCFramework to repo root for Swift package
        run: |
          XCF=$(find shared/build/XCFrameworks/release -maxdepth 1 -type d -name '*.xcframework' | head -1)
          cp -R "$XCF" ./ChatSDK.xcframework

      # - name: Zip XCFramework and compute checksum (GitHub Release asset)
      #   run: |
      #     cd shared/build/XCFrameworks/release
      #     XCF=$(find . -maxdepth 1 -type d -name '*.xcframework' | head -1)
      #     zip -r ChatSDK.xcframework.zip "$XCF"
      #     shasum -a 256 ChatSDK.xcframework.zip | awk '{ print $1 }' > ../../../ChatSDK.xcframework.zip.sha256

      - name: Publish iOS Swift package to AWS CodeArtifact (same repo as Android)
        run: |
          aws codeartifact login --tool swift \
            --domain ${{ env.AWS_DOMAIN }} \
            --domain-owner ${{ env.AWS_ACCOUNT_ID }} \
            --repository ${{ env.AWS_REPO }} \
            --region ${{ env.AWS_REGION }}

          # Build archive with Package.swift + ChatSDK.xcframework only (swift package archive-source can omit binary targets)
          zip -r ChatSDK.zip Package.swift ChatSDK.xcframework

          SWIFT_REGISTRY_URL="https://${{ env.AWS_DOMAIN }}-${{ env.AWS_ACCOUNT_ID }}.d.codeartifact.${{ env.AWS_REGION }}.amazonaws.com/swift/${{ env.AWS_REPO }}/${{ env.SWIFT_PACKAGE_SCOPE }}/${{ env.SWIFT_PACKAGE_NAME }}/${{ env.VERSION }}"
          curl -X PUT --user "aws:${{ env.CODEARTIFACT_AUTH_TOKEN }}" \
            -H "Accept: application/vnd.swift.registry.v1+json" \
            -F "source-archive=@ChatSDK.zip" \
            "$SWIFT_REGISTRY_URL"

      # - uses: softprops/action-gh-release@v2
