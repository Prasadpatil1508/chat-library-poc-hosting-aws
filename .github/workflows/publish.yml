name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: macos-latest

    env:
      GRADLE_OPTS: "-Xmx4g"
      ORG_GRADLE_PROJECT_kotlin.native.ignoreDisabledTargets: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure Gradle TLS
        run: |
          echo "org.gradle.jvmargs=-Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2" >> gradle.properties

      - name: Get CodeArtifact auth token
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain ${{ secrets.AWS_DOMAIN }} \
            --domain-owner ${{ secrets.AWS_ACCOUNT_ID }} \
            --region ${{ secrets.AWS_REGION }} \
            --query authorizationToken \
            --output text)

          echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AWS_DOMAIN=${{ secrets.AWS_DOMAIN }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_REPO=${{ secrets.AWS_REPO }}" >> $GITHUB_ENV

      - name: Inject Connect config for remote library build
        run: |
          echo "API_GATEWAY=${{ secrets.API_GATEWAY }}" >> local.properties
          echo "CONTACT_FLOW_ID=${{ secrets.CONTACT_FLOW_ID }}" >> local.properties
          echo "INSTANCE_ID=${{ secrets.INSTANCE_ID }}" >> local.properties
          echo "REGION=${{ secrets.REGION }}" >> local.properties

      - name: Publish Android library to AWS CodeArtifact
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF#refs/tags/v}"

          ./gradlew clean \
            :shared:generateConnectConfig \
            :shared:publishAndroidPublicationToAWSCodeArtifactRepository \
            -PLIB_VERSION="$VERSION" \
            --no-daemon \
            --no-configuration-cache

      - name: Assemble XCFramework
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework \
            --no-daemon \
            --no-configuration-cache

      - name: Zip XCFramework and compute checksum
        run: |
          cd shared/build/XCFrameworks/release
          XCF=$(find . -maxdepth 1 -type d -name '*.xcframework' | head -1)
          zip -r ChatSDK.xcframework.zip "$XCF"
          shasum -a 256 ChatSDK.xcframework.zip | awk '{ print $1 }' > ../../../ChatSDK.xcframework.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            shared/build/XCFrameworks/release/ChatSDK.xcframework.zip
            ChatSDK.xcframework.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
