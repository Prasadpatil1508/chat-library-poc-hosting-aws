#Gradle (heap sized for Kotlin/Native XCFramework link; reduce if not building iOS)
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.caching=true
org.gradle.configuration-cache=true
# Fewer workers = less peak memory when linking iOS frameworks in parallel
org.gradle.workers.max=2

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true